# Offline tests on every push and pull request. They need no GPU, no network, no models and no desktop
# (Qt runs offscreen; the OCR-engine tests skip themselves without the engine environment).
# Rehearsed locally 2026-11-12 with the same recipe: Python 3.12 + PyPI PySide6-Essentials + numpy, 59 tests.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install PySide6-Essentials numpy
      - run: python -m unittest discover -s tests -t . -v
        env:
          QT_QPA_PLATFORM: offscreen
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: bash -n install.sh && bash -n packaging/build-appimage.sh && bash -n packaging/AppRun
      - name: shellcheck (warnings and errors)
        run: shellcheck -S warning install.sh packaging/build-appimage.sh packaging/AppRun
      - name: every Python file compiles
        run: python3 -m compileall -q .
